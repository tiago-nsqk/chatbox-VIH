<!DOCTYPE html>
<html>
<head>
    <style>
        .button{
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            transition: background-color 0.3s, transform 0.3;
            cursor: pointer;
            border-radius: 5px;
        }
        .button-primary{
            background-color: darkred; /*vino tinto*/
        }
        .button-primary:hover{
            background-color: orangered;
        }
        .button-secondary{
            background-color: steelblue;/*azul*/
        }
        .button-secondary:hover{
            background-color: aqua;
        }
        .button-danger{
            background-color: chocolate;
        }
        .button-danger:hover{
            background-color: crimson;
        }
        .button-warning{
            background-color: chartreuse;
        }
        .button-warning:hover{
            background-color: forestgreen;
        }
        button:hover{
            transform: scale(1.05);
        }
    .div2{
        border: 10px solid #3ec003;
        background: #002500;
        height: 100px;
        width: 200px;
        padding: 10px
        margin 10px;
    }




</style>

</head>
<body>

<h2>Botones estilizados</h2>
    <button class="button button-primary">primario</button>
    <button class="button button-secondary">secundario</button>
   <button class="button button-danger">peligro</button>
    <button class="button button-warning">advertencia</button>
  
    


</body>
</html>
