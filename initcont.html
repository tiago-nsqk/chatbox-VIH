<!DOCTYPE html>
<html>
    <head>
        <style>
            .block{
                display: block;
                width: 100%;
                background-color: cornflowerblue;
                margin-bottom: 10px;
            }

            .inline{
                display: inline;
                background-color: chartreuse;
            }
            .inline-block{
                display: inline-block;
                width: 150px;
                height: 100px;
                background-color: blueviolet;
                margin: 10px;
            }
            .flex-container{
                display: flex;
                background-color: aliceblue;
            }

            .flex-item{
                background-color: brown;
                padding: 20px;
                margin: 10px;
            }
            .grid-container{
                display: grid;
                grid-template-columns: auto auto auto;
                background-color: azure;
            }
            .grid-item{
                background-color: bisque;
                padding: 20px;
                margin: 10px;
            }
        </style>
    </head>

    <body>
        <div class="block">Conoce más del VIH</div>
        <span class="inline">¿Qué es?</span>
        <div class="inline-block">virus de inmunodeficiencia humana</div>
        <div class="flex-container">
            <div class="flex-item">ayuda</div>
            <div class="flex-item">Conoce</div>
            <div class="flex-item">EVITA</div>
            <div class="flex-item">Tratamiento</div>
        </div>
        <div class="grid-container">
            <div class="grid-item">Entidades</div>
            <div class="grid-item">testimonios</div>
            <div class="grid-item">fuentes</div>
            <div class="grid-item">evitar</div>
        </div>
    </body>
</html>
