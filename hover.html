<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
   .hover-image{
    width: 300px;
    height: 200px;
    overflow: hidden;
    position: relative;
    margin: 50px auto;
   }

   .hover-image img{
    width: 100%;
    height: 100%;
    transition: transform 0.6s, filter 0.6s;
   }
   .hover-image:hover img{
    transform: translate(-20%) scale(0.2);
    filter: blur(2px);
   }
    </style>
</head>

<body>
    <div class="hover-image">
        <img src="img3.jpeg" alt="imagen de ejemplo">
    </div>
</body>
</html>
